name: Backend Tests

on:
  push:
    branches: [ main, develop ]
    paths:
      - 'backend/**'
      - '.github/workflows/backend-tests.yml'
  pull_request:
    branches: [ main, develop ]
    paths:
      - 'backend/**'
      - '.github/workflows/backend-tests.yml'

jobs:
  test:
    runs-on: ubuntu-latest
    
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.10', '3.11', '3.12']

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}
        cache: 'pip'
        cache-dependency-path: 'backend/requirements.txt'

    - name: Install dependencies
      working-directory: ./backend
      run: |
        python -m pip install --upgrade pip setuptools wheel
        pip install -r requirements.txt
        pip install pytest pytest-django pytest-cov pytest-xdist

    - name: Run linting
      working-directory: ./backend
      run: |
        pip install flake8 black isort
        # Stop the build if there are Python syntax errors or undefined names
        flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics --exclude=*/migrations/*,*/venv/*,*/env/*
        # Check code formatting (non-blocking)
        black --check . --exclude '/(migrations|venv|env)/' || true
        isort --check-only . --skip migrations --skip venv --skip env || true
      continue-on-error: true

    - name: Run tests with coverage
      working-directory: ./backend
      env:
        DJANGO_SETTINGS_MODULE: config.settings.test
        SECRET_KEY: test-secret-key-for-ci-do-not-use-in-production
        DEBUG: False
      run: |
        # Run tests with coverage
        pytest --cov=. --cov-report=xml --cov-report=term-missing --cov-report=html -n auto --maxfail=5

    - name: Upload coverage to Codecov
      uses: codecov/codecov-action@v4
      with:
        file: ./backend/coverage.xml
        flags: backend
        name: backend-py${{ matrix.python-version }}
        fail_ci_if_error: false
      continue-on-error: true

    - name: Upload coverage HTML report
      uses: actions/upload-artifact@v4
      with:
        name: coverage-report-py${{ matrix.python-version }}
        path: backend/htmlcov/
        retention-days: 7
      if: always()

    - name: Check coverage threshold
      working-directory: ./backend
      run: |
        pip install coverage
        coverage report --fail-under=80
      continue-on-error: true
