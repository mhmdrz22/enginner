name: Code Quality

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  # Backend Code Quality
  backend-quality:
    name: Backend Code Quality
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'
    
    - name: Install linters
      run: |
        pip install flake8 black isort mypy pylint bandit
    
    - name: Run Flake8
      working-directory: ./backend
      run: |
        flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics
        flake8 . --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics
      continue-on-error: true
    
    - name: Check Black formatting
      working-directory: ./backend
      run: black --check .
      continue-on-error: true
    
    - name: Check isort
      working-directory: ./backend
      run: isort --check-only .
      continue-on-error: true
    
    - name: Run Bandit security scan
      working-directory: ./backend
      run: bandit -r . -f json -o bandit-report.json
      continue-on-error: true
    
    - name: Upload Bandit report
      uses: actions/upload-artifact@v4
      with:
        name: bandit-security-report
        path: backend/bandit-report.json
      if: always()

  # Frontend Code Quality
  frontend-quality:
    name: Frontend Code Quality
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20.x'
        cache: 'npm'
        cache-dependency-path: frontend/package-lock.json
    
    - name: Install dependencies
      working-directory: ./frontend
      run: npm ci
    
    - name: Run ESLint
      working-directory: ./frontend
      run: npm run lint
      continue-on-error: true
    
    - name: Check Prettier formatting
      working-directory: ./frontend
      run: npx prettier --check "src/**/*.{ts,tsx,js,jsx,json,css}"
      continue-on-error: true
    
    - name: TypeScript type check
      working-directory: ./frontend
      run: npm run type-check
      continue-on-error: true

  # Dependency Security Audit
  security-audit:
    name: Security Audit
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Backend dependency audit
      working-directory: ./backend
      run: |
        pip install safety
        safety check --json > safety-report.json || true
      continue-on-error: true
    
    - name: Frontend dependency audit
      working-directory: ./frontend
      run: npm audit --json > npm-audit.json || true
      continue-on-error: true
    
    - name: Upload audit reports
      uses: actions/upload-artifact@v4
      with:
        name: security-audit-reports
        path: |
          backend/safety-report.json
          frontend/npm-audit.json
      if: always()

  # Code Complexity Analysis
  complexity-analysis:
    name: Code Complexity
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Setup Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'
    
    - name: Install radon
      run: pip install radon
    
    - name: Backend complexity check
      working-directory: ./backend
      run: |
        radon cc . -a -nb > complexity-report.txt
        radon mi . -nb >> complexity-report.txt
      continue-on-error: true
    
    - name: Upload complexity report
      uses: actions/upload-artifact@v4
      with:
        name: complexity-report
        path: backend/complexity-report.txt
      if: always()
