name: Integration Tests (E2E)

# Currently disabled - enable when ready for full integration testing
on:
  workflow_dispatch:  # Manual trigger only
  # push:
  #   branches: [ main, develop ]
  # pull_request:
  #   branches: [ main, develop ]

jobs:
  integration:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: test_taskboard
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    # Backend Setup
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'
        cache: 'pip'
        cache-dependency-path: 'backend/requirements.txt'

    - name: Install backend dependencies
      working-directory: ./backend
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Run migrations
      working-directory: ./backend
      env:
        DJANGO_SETTINGS_MODULE: config.settings.test
        POSTGRES_DB: test_taskboard
        POSTGRES_USER: postgres
        POSTGRES_PASSWORD: postgres
        POSTGRES_HOST: localhost
        POSTGRES_PORT: 5432
        REDIS_URL: redis://localhost:6379/1
      run: |
        python manage.py migrate --noinput
        python manage.py collectstatic --noinput

    - name: Start backend server
      working-directory: ./backend
      env:
        DJANGO_SETTINGS_MODULE: config.settings.test
        POSTGRES_DB: test_taskboard
        POSTGRES_USER: postgres
        POSTGRES_PASSWORD: postgres
        POSTGRES_HOST: localhost
        POSTGRES_PORT: 5432
        REDIS_URL: redis://localhost:6379/1
      run: |
        python manage.py runserver 8000 &
        sleep 5
        curl http://localhost:8000/api/health/ || echo "Backend not ready"

    # Frontend Setup
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20.x'

    - name: Install frontend dependencies
      working-directory: ./frontend
      run: npm install --prefer-offline --no-audit

    - name: Install Playwright Browsers
      working-directory: ./frontend
      run: npx playwright install --with-deps chromium

    # Run Integration Tests
    - name: Run E2E tests
      working-directory: ./frontend
      env:
        CI: true
        VITE_API_URL: http://localhost:8000
      run: npm run test:e2e

    - name: Upload Playwright report
      uses: actions/upload-artifact@v4
      with:
        name: playwright-report
        path: frontend/playwright-report/
        retention-days: 7
      if: always()

    - name: Upload test results
      uses: actions/upload-artifact@v4
      with:
        name: test-results
        path: frontend/test-results/
        retention-days: 7
      if: failure()

    - name: Upload screenshots
      uses: actions/upload-artifact@v4
      with:
        name: screenshots
        path: frontend/test-results/**/*.png
        retention-days: 7
      if: failure()
