name: CD Pipeline (Production)

on:
  push:
    branches: [ "main" ]

jobs:
  build-and-push:
    name: Build and Push Docker Images
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and Push Backend Image
        run: |
          docker build -t ghcr.io/${{ github.repository }}/enginner-backend:latest ./backend
          docker push ghcr.io/${{ github.repository }}/enginner-backend:latest

      - name: Build and Push Frontend Image
        run: |
          docker build --build-arg VITE_API_URL=${{ secrets.VITE_API_URL_PROD }} -t ghcr.io/${{ github.repository }}/enginner-frontend:latest ./frontend
          docker push ghcr.io/${{ github.repository }}/enginner-frontend:latest